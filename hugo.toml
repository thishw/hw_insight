baseURL = "https://insight.thishw.com/"
title = "HW Insight"
defaultContentLanguage = "ko"
# ko는 접미사 없이 루트에 그대로 유지(/posts/...), en만 /en/ 프리픽스가 붙는다 —
# 기존 한국어 URL을 안 바꿔서 기존 SEO 점수/백링크를 그대로 보존한다.
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
# CLI_HANDOFF_38 A-3: pulse/wave는 이미 설정돼 있었으나 insight만 누락 —
# 미설정 시 RSS pubDate가 +0000로 나가고, A-2(BlogPosting datePublished 시각+
# 타임존 추가)를 적용하면 UTC가 그대로 박힌다. A-2보다 먼저 적용.
timeZone = "Asia/Seoul"

# 콘텐츠는 파일명 접미사로 번역쌍을 묶는다(date-slug.md=ko, date-slug.en.md=en) —
# src/output/static_site.py::hugo_page_path()가 이 규칙에 맞춰 발행한다.
# F1(A-1, 양방향): 메뉴를 언어별로 분리 — url 대신 pageRef를 써야 언어별로
# 올바르게 해석된다(공유 [[menu.main]]은 /en/에서도 한국어 메뉴+URL이 노출되던
# 버그의 원인이었다 — pulse/wave와 정확히 대칭인 결함, CLI_HANDOFF_37 §A-1).
# en 카테고리는 term을 메뉴에 박지 않고 Home/Categories(일반)만 둔다 — term
# 문자열은 Synapse의 export가 실어 보내므로(WP-9: 테크→Tech·투자→Investing·
# 생각→Thoughts) 여기에 복사해 두면 팔레트가 바뀔 때 조용히 어긋난다.
# Categories 목록 페이지가 실재하는 term을 자동 열거한다.
[languages]
  [languages.ko]
    label = "한국어"
    weight = 1
    [[languages.ko.menu.main]]
      name   = "홈"
      pageRef = "/"
      weight = 1
    [[languages.ko.menu.main]]
      name   = "테크"
      pageRef = "/categories/테크/"
      weight = 2
    [[languages.ko.menu.main]]
      name   = "투자"
      pageRef = "/categories/투자/"
      weight = 3
    [[languages.ko.menu.main]]
      name   = "생각"
      pageRef = "/categories/생각/"
      weight = 4
    [languages.ko.params]
      # 명시 정의는 선택이지만 권장(테마 기본값이 바뀌면 조용히 흔들린다) — 값은
      # 테마가 현재 쓰는 하드코딩 기본값과 동일해 시각적 변화가 없다. 단
      # label_ai_image/label_view_all은 테마 기본값이 우연히 영문이라(각각
      # show_hero/magazine 미사용으로 현재 도달 불가) 한국어 값으로 명시한다.
      label_home                = "홈"
      label_search              = "검색"
      label_search_placeholder  = "글 검색…"
      label_recent              = "최근 글"
      label_categories          = "카테고리"
      label_all_categories      = "← 모든 카테고리"
      label_related             = "관련 글"
      label_no_posts            = "이 카테고리에 글이 없습니다."
      label_count_suffix        = "편"
      label_llms_posts_heading  = "글 목록"
      label_taxonomy_desc       = "카테고리별로 글을 모아볼 수 있습니다."
      label_categories_desc     = "카테고리별로 글을 모아볼 수 있습니다."
      label_keywords_desc       = "키워드별로 글을 모아볼 수 있습니다."
      label_taxonomy_empty      = "아직 카테고리가 없습니다."
      label_keywords_empty      = "아직 키워드가 없습니다."
      label_search_empty        = "결과 없음"
      label_search_noscript     = "검색에는 자바스크립트가 필요합니다."
      label_read_more           = "더 읽기 →"
      label_prev                = "← 이전"
      label_next                = "다음 →"
      label_pagination          = "페이지 내비게이션"
      label_view_all            = "전체 보기 →"
      label_ai_image            = "AI 생성 이미지"
  [languages.en]
    label = "English"
    weight = 2
    [[languages.en.menu.main]]
      name   = "Home"
      pageRef = "/"
      weight = 1
    [[languages.en.menu.main]]
      name   = "Categories"
      pageRef = "/categories/"
      weight = 2
    [languages.en.params]
      # WP-10: date_format이 top-level [params]에만 있어 en 페이지 날짜가
      # "2026년 8월 22일"로 렌더됐다 — #160·#162가 막은 것과 **별개 경로**의
      # 한국어 누출이 라이브에 남아 있었다. 테마는 site.Params.date_format을
      # 목록·본문·사이드바·관련글·term 페이지 전부에서 읽으므로 en 사이트의
      # 모든 날짜가 이 한 줄에 걸린다.
      # 형식은 ko("2006년 1월 2일")와 같은 정밀도의 영문 관용 표기를 쓴다.
      date_format               = "January 2, 2006"
      # WP-10 후속: 기본 OG 카드(images/og-default.png)에 한국어 카피와 테크/투자/
      # 생각 칩이 박혀 있어, 글별 일러스트가 없는 en 페이지를 공유하면 한국어
      # 카드가 떴다(social-meta.html: `.Params.og_image | default site.Params.og_image`).
      # 영문 카드로 오버라이드한다 — 레이아웃·색·타이포는 원본과 동일하고
      # 카피와 칩만 영문이다(칩은 WP-9 카테고리 매핑과 같은 어휘).
      og_image                  = "images/og-default-en.png"
      # F9(B-2): insight는 label_* 를 하나도 정의하지 않아 테마의 하드코딩
      # 한국어 기본값이 /en/에도 그대로 노출됐다 — 이 사이트 전용 결함(pulse/
      # wave는 top-level에 영문 기본값을 이미 정의해 뒀음). 테마가 참조하는
      # label_* 23개 전부를 여기서 정의한다.
      description               = "Turning thinking into structure, and structure into publication — knowledge insights by HW."
      og_locale                 = "en_US"
      label_home                = "Home"
      label_search              = "Search"
      label_search_placeholder  = "Search articles…"
      label_recent              = "Recent Posts"
      label_categories          = "Categories"
      label_all_categories      = "← All Categories"
      label_related             = "Related Posts"
      label_no_posts            = "No posts in this category."
      label_count_suffix        = " posts"
      label_llms_posts_heading  = "Posts"
      label_taxonomy_desc       = "Browse posts by category."
      label_categories_desc     = "Browse posts by category."
      label_keywords_desc       = "Browse posts by keyword."
      label_taxonomy_empty      = "No categories yet."
      label_keywords_empty      = "No keywords yet."
      label_search_empty        = "No results"
      label_search_noscript     = "Search requires JavaScript."
      label_read_more           = "Read more →"
      label_prev                = "← Previous"
      label_next                = "Next →"
      label_pagination          = "Pagination"
      label_view_all            = "View all →"
      label_ai_image            = "AI-generated illustration"

# 홈에서 검색 색인(index.json) 생성 — 공통 Module의 클라이언트 검색이 사용
[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]

# llms.txt — LLM용 사이트 인덱스 (GEO 실험)
[outputFormats.llms]
  mediaType = "text/plain"
  baseName  = "llms"
  isPlainText = true

[params]
  author         = "HW"
  site_key       = "hw_insight"
  tier           = "A"
  # CLI_HANDOFF_38 A-1: 홈/카테고리 목록은 이미 이 형식(테마 기본값)이었고 글 본문·
  # 사이드바·관련글은 ISO 하드코딩 폴백을 쓰고 있었다 — 명시 정의로 전체 통일.
  date_format    = "2006년 1월 2일"
  description    = "사고를 구조로, 구조를 발행으로 — 지식 인사이트"
  og_site_name   = "HW Insight"
  og_locale      = "ko_KR"
  og_image       = "images/og-default.png"
  logo           = "/brand/wordmark.svg"
  logo_dark      = "/brand/wordmark-dark.svg"
  gtm_id         = "GTM-5B6XBNBH"
  verify_google  = "EvHXpDorbbKE9CntN4aVXNtiENA4ilq7byW4ncIlBSw"
  verify_naver   = "67558bc01f225a55bd4fcf6dc0afd7188dbf5d70"
  verify_bing    = ""
  adsense_pub_id = "ca-pub-7608448237186938"
  daum_verification = ""

# WP-W: 자매 매체 내비게이션(공유 테마 footer partial) — 자기 자신 제외, 형제 2개
[[params.network_links]]
  name = "The Korea Pulse"
  url  = "https://pulse.koreasignals.com/"
[[params.network_links]]
  name = "The Korea Wave"
  url  = "https://wave.koreasignals.com/"

[taxonomies]
  category = "categories"

[markup.goldmark.renderer]
  unsafe = true

# 관련 글 자동 추천 — keywords/categories 기반으로 매 빌드마다 재계산된다.
# 새 글을 올리면 전체 재빌드 과정에서 관련 옛 글에도 자동 반영(옛 글 수정 불필요).
[related]
  threshold = 20
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10

[module]
  [[module.imports]]
    path = "github.com/thishw/media-hugo-shared"
